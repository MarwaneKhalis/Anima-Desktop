name: Release Windows desktop
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        default: v0.2.0
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm build
      - run: pnpm test
      - run: pnpm desktop:dist
      - name: Install and smoke-test the Windows installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path (Get-Location) "release/Anima Connect Setup $version.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "Installer not found: $installer" }
          $installDir = Join-Path $env:RUNNER_TEMP "Anima Connect"
          $arguments = @("/S", "/D=$installDir")
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($process.ExitCode)." }
          $installedExe = Join-Path $installDir "Anima Connect.exe"
          if (!(Test-Path -LiteralPath $installedExe)) { throw "Installed executable was not found: $installedExe" }
          $env:ANIMA_DESKTOP_EXECUTABLE = $installedExe
          pnpm desktop:smoke
          if ($LASTEXITCODE -ne 0) { throw "Installed app smoke test failed with exit code $LASTEXITCODE." }
      - name: Prepare a stable download filename
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path (Get-Location) "release/Anima Connect Setup $version.exe"
          Copy-Item -LiteralPath $installer -Destination "release/Anima-Desktop-Setup.exe" -Force
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          gh release create $tag "release/Anima-Desktop-Setup.exe" --title "Anima Desktop $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed with exit code $LASTEXITCODE." }
